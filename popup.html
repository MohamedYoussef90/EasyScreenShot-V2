<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h1>📸 EasyScreenshot</h1>
    <p>Capture and preview screenshots</p>
  </div>
  
  <button id="visibleAreaBtn" class="button">
    <span class="button-icon">👁️</span>
    Capture Visible Area
  </button>
  
  <button id="entirePageBtn" class="button">
    <span class="button-icon">📄</span>
    Capture Entire Page
  </button>
  
  <div class="divider"></div>
  
  <div class="toggle-container">
    <span class="toggle-label">Include URL</span>
    <div id="urlToggle" class="toggle active">
      <div class="toggle-slider"></div>
    </div>
  </div>
  
  <div class="status" id="status" role="status" aria-live="polite">Ready to capture</div>
  
  <!-- New footer section -->
  <div class="footer">
    Developed by Mohamed Youssef
  </div>

  <script src="popup.js"></script>
</body>
</html>
