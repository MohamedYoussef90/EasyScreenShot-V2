<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>EasyScreenshot - Preview</title>
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="screenshot_preview.css">
</head>
<body>
  <div class="header">
    <h1>📸 EasyScreenshot Preview</h1>
    <div class="header-actions">
      <button id="downloadBtn" class="btn btn-primary" aria-label="Download screenshot">💾 Download</button>
      <button id="copyBtn" class="btn" aria-label="Copy screenshot to clipboard">📋 Copy</button>
      <button id="closeBtn" class="btn" aria-label="Close preview tab">✕ Close</button>
    </div>
  </div>
  
  <div class="workspace">
    <div id="annotationToolbar" class="toolbar" role="toolbar" aria-label="Screenshot annotation tools" style="display: none;">
      <div class="toolbar-group" aria-label="Drawing tools">
        <button id="rectangleTool" class="tool-btn" type="button" aria-pressed="true" title="Draw a rectangle">▭ Rectangle</button>
        <button id="penTool" class="tool-btn" type="button" aria-pressed="false" title="Draw freehand">✏️ Pen</button>
        <button id="redactTool" class="tool-btn" type="button" aria-pressed="false" title="Paint an opaque redaction stroke">🔒 Blur / Redact</button>
      </div>
      <div class="toolbar-group">
        <label for="annotationColor">Color</label>
        <input id="annotationColor" type="color" value="#ff3b30" aria-label="Annotation color">
        <label for="annotationThickness">Thickness</label>
        <select id="annotationThickness" aria-label="Annotation thickness">
          <option value="thin">Thin</option>
          <option value="medium" selected>Medium</option>
          <option value="thick">Thick</option>
        </select>
      </div>
      <div class="toolbar-group">
        <button id="undoBtn" class="tool-btn" type="button" disabled title="Undo last annotation">↩️ Undo</button>
        <button id="clearBtn" class="tool-btn" type="button" disabled title="Remove all annotations">🗑️ Clear All</button>
      </div>
      <div class="toolbar-hint">Redaction uses a solid opaque stroke to reliably cover sensitive content.</div>
    </div>
    <div class="content">
      <div id="loading" class="loading">
        <div class="loading-spinner"></div>
        Processing screenshot...
      </div>
      <div id="screenshotContainer" class="screenshot-container" style="display: none;">
        <canvas id="screenshotCanvas" class="screenshot-canvas" role="img" aria-label="Screenshot preview with annotations"></canvas>
      </div>
    </div>
  </div>
  
  <div id="infoBar" class="info-bar" style="display: none;">
    <div class="url-info" id="urlInfo"></div>
    <div class="timestamp" id="timestamp"></div>
  </div>
  
  <script src="screenshot_preview.js"></script>
</body>
</html>
